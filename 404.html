<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 · 朱伟榔</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icon-192.png" sizes="192x192">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#080b12;color:#eef2f8;text-align:center;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .bg span{position:absolute;border-radius:50%;filter:blur(110px);opacity:.4}
  .b1{width:460px;height:460px;background:#1d4ed8;top:-160px;left:-120px}
  .b2{width:400px;height:400px;background:#7c3aed;bottom:-180px;right:-120px}
  .box{position:relative;z-index:1;max-width:420px}
  .code{
    font-size:96px;font-weight:700;line-height:1;letter-spacing:-2px;
    background:linear-gradient(135deg,#6ee7ff,#a78bfa);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:19px;font-weight:600;margin-top:14px;letter-spacing:1px}
  p{font-size:13.5px;color:#98a5ba;line-height:1.9;margin-top:12px}
  .home{
    display:inline-flex;align-items:center;gap:8px;margin-top:26px;
    padding:12px 24px;border-radius:13px;text-decoration:none;font-size:13.5px;font-weight:600;
    color:#04121a;background:linear-gradient(135deg,#6ee7ff,#a78bfa);
    box-shadow:0 14px 30px -14px rgba(110,231,255,.85);transition:.25s;
  }
  .home:hover{filter:brightness(1.08);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="bg"><span class="b1"></span><span class="b2"></span></div>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>可能是链接写错了，也可能是这里本来就没放东西。<br>回主页看看吧。</p>
    <a class="home" href="/">← 回到主页</a>
  </div>
</body>
</html>
